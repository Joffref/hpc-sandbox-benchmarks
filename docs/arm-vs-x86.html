<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const rows = DATA.rows;
  const GROUP_LABEL = { cpu: "CPU (Node)", memory: "Memory (STREAM)", disk: "Disk (fio, hardlink)", network: "Network (iperf3)", realworld: "Real-world pipelines", system: "System (pgbench, SQLite, git, PyBench)" };
  const groups = ["cpu", "memory", "disk", "network", "realworld", "system"].filter(g => rows.some(r => r.dimension === g));

  // ---- layout ---------------------------------------------------------------
  const W = 976, ML = 268, MR = 96, MT = 34, MB = 30;
  const ROW = 26, BAR = 16, GROUP_HEAD = 30, GROUP_GAP = 14;
  const plotW = W - ML - MR;
  const lg = v => Math.log2(v);
  const maxAbs = Math.max(...rows.map(r => Math.abs(lg(r.ratio))));
  const dom = Math.ceil(maxAbs * 2) / 2;               // symmetric, in log2 units (e.g. 2 => 0.25x .. 4x)
  const x = v => ML + ((lg(v) + dom) / (2 * dom)) * plotW;
  const x0 = x(1);

  let y = MT; const placed = [];
  for (const g of groups) {
    placed.push({ kind: "group", g, y });
    y += GROUP_HEAD;
    const list = rows.filter(r => r.dimension === g);
    const ext = list.length > 2 ? new Set([list[0].id, list[list.length - 1].id]) : new Set(list.map(r => r.id));
    for (const r of list) { placed.push({ kind: "row", r, y, label: ext.has(r.id) }); y += ROW; }
    y += GROUP_GAP;
  }
  const H = y + MB;

  // Axis ticks at whole log2 steps only, written as multipliers (1/4×, 1/2×, 1×, 2×, 4×) so the
  // symmetric scale reads as symmetric; half steps drew too many crowded labels.
  const fmtX = v => v >= 1 ? `${Math.round(v)}×` : `1/${Math.round(1 / v)}×`;
  const fmtRel = ratio => ratio >= 1 ? `${(+ratio.toFixed(ratio >= 10 ? 0 : 2)).toString().replace(/\.?0+$/, "")}× faster` : `${(+(1 / ratio).toFixed(2)).toString().replace(/\.?0+$/, "")}× slower`;
  const fmtVal = v => v >= 1000 ? Math.round(v).toLocaleString("en-US") : +v.toPrecision(3);

  const ticks = []; for (let t = -Math.floor(dom); t <= Math.floor(dom) + 1e-9; t += 1) ticks.push(t);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="chart-title chart-desc">`;
  svg += `<title id="chart-title">ARM relative to x86 per metric</title><desc id="chart-desc">Diverging bars on a log scale; bars right of 1× mean ARM was faster, left mean slower. Table view below carries every value.</desc>`;
  svg += `<g class="grid">`;
  for (const t of ticks) { const tx = ML + ((t + dom) / (2 * dom)) * plotW; svg += `<line x1="${tx}" x2="${tx}" y1="${MT - 8}" y2="${H - MB}"/>`; }
  svg += `</g>`;
  svg += `<line class="baseline" x1="${x0}" x2="${x0}" y1="${MT - 12}" y2="${H - MB + 4}"/>`;
  for (const t of ticks) { const tx = ML + ((t + dom) / (2 * dom)) * plotW; svg += `<text class="tick" x="${tx}" y="${MT - 14}" text-anchor="middle">${fmtX(2 ** t)}</text>`; }
  svg += `<text class="tick" x="${ML}" y="${H - 8}" text-anchor="start">← ARM slower</text><text class="tick" x="${ML + plotW}" y="${H - 8}" text-anchor="end">ARM faster →</text>`;

  for (const p of placed) {
    if (p.kind === "group") { svg += `<text class="group" x="8" y="${p.y + 19}">${esc(GROUP_LABEL[p.g])}</text>`; continue; }
    const r = p.r, cls = r.ratio >= 1 ? "faster" : "slower";
    const xr = x(r.ratio), left = Math.min(x0, xr), width = Math.max(0, Math.abs(xr - x0));
    const by = p.y + (ROW - BAR) / 2, rr = Math.min(4, width);
    // 4px rounded data-end, square at the baseline; 2px surface gap comes from ROW - BAR air.
    let path;
    if (width < 0.5) path = `M${x0 - 0.5},${by} h1 v${BAR} h-1 z`;
    else if (r.ratio >= 1) path = `M${x0},${by} h${width - rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${BAR - 2 * rr} a${rr},${rr} 0 0 1 -${rr},${rr} h-${width - rr} z`;
    else path = `M${x0},${by} h-${width - rr} a${rr},${rr} 0 0 0 -${rr},${rr} v${BAR - 2 * rr} a${rr},${rr} 0 0 0 ${rr},${rr} h${width - rr} z`;
    svg += `<g class="row" tabindex="0" data-id="${esc(r.id)}" aria-label="${esc(r.label)}: ${esc(fmtRel(r.ratio))}">`;
    svg += `<text class="metric" x="${ML - 12}" y="${p.y + 17}" text-anchor="end">${esc(r.label)}</text>`;
    svg += `<path class="bar ${cls}" d="${path}"/>`;
    if (p.label) {
      // Value label rides at the bar's data-end. A "slower" bar that reaches the left margin has no
      // room outside its end without colliding with the metric name, so its label moves to the
      // empty side of the baseline instead of being clipped or overlapping.
      const text = fmtRel(r.ratio), approxW = text.length * 6.6;
      let tx = r.ratio >= 1 ? xr + 8 : xr - 8, anchor = r.ratio >= 1 ? "start" : "end";
      if (r.ratio < 1 && xr - 8 - approxW < ML + 4) { tx = x0 + 8; anchor = "start"; }
      svg += `<text class="vlabel" x="${tx}" y="${p.y + 17}" text-anchor="${anchor}">${esc(text)}</text>`;
    }
    svg += `<rect class="hit" x="${ML - 260}" y="${p.y}" width="${plotW + 260 + MR}" height="${ROW}"/>`;
    svg += `</g>`;
  }
  svg += `</svg>`;
  const chart = document.getElementById("chart");
  chart.innerHTML = svg;

  // ---- subtitle / note ---------------------------------------------------------
  const a = DATA.armSpec, b = DATA.x86Spec;
  const faster = rows.filter(r => r.ratio > 1.02).length, slower = rows.filter(r => r.ratio < 0.98).length;
  document.getElementById("subtitle").textContent =
    `Median of each metric, ARM relative to x86 on a log scale. ${rows.length} metrics: ARM faster on ${faster}, slower on ${slower}, within 2% on ${rows.length - faster - slower}.`;
  document.getElementById("note").innerHTML =
    `ARM: ${esc(a.cpuModel)}, ${a.vcpus} vCPU, ${a.memoryGb} GiB, ${esc(a.os)}; runs 35247716410 and 35300489795 pooled (2 sandboxes, 2 PTS passes each; real-world tasks 1 pass each). ` +
    `x86: ${esc(b.cpuModel)}, ${b.vcpus} vCPU, ${b.memoryGb} GiB, ${esc(b.os)}; upstream run 34853816482 (6 replicates; real-world 12). ` +
    `Both on Blaxel, same 40 GB ephemeral volume. Every value is the p50 median of that side's samples; "faster" is the better-direction ratio (time metrics inverted). ` +
    `fio runs with Direct=No on both sides, so its numbers reflect the page cache, not the volume. ` +
    `Not shown: realworld-openclaw (no arm64-musl build of a dependency), fast-cli (glibc-only Chrome). ` +
    `Treat the ARM side as indicative until more replicates land.`;

  // ---- tooltip -------------------------------------------------------------------
  const tip = document.getElementById("tooltip"); const byId = new Map(rows.map(r => [r.id, r]));
  const show = (el, ev) => {
    const r = byId.get(el.dataset.id); if (!r) return;
    tip.innerHTML = `<b>${esc(r.label)}</b><div class="k">${esc(GROUP_LABEL[r.dimension])} · ${esc(fmtRel(r.ratio))}</div>` +
      `<table><tr><td class="k">ARM</td><td>${fmtVal(r.arm)} ${esc(r.unit)}</td><td class="k">n=${r.nArm}</td></tr>` +
      `<tr><td class="k">x86</td><td>${fmtVal(r.x86)} ${esc(r.unit)}</td><td class="k">n=${r.nX86}</td></tr></table>` +
      `<div class="k">${r.direction === "LIB" ? "lower is better" : "higher is better"}</div>`;
    tip.style.opacity = "1";
    const rect = chart.getBoundingClientRect();
    const px = ev ? ev.clientX - rect.left : rect.width / 2, py = ev ? ev.clientY - rect.top : 0;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = `${Math.min(px + 14, rect.width - tw - 8)}px`;
    tip.style.top = `${Math.max(0, py - th - 12)}px`;
  };
  const hide = () => { tip.style.opacity = "0"; };
  for (const el of chart.querySelectorAll(".row")) {
    el.addEventListener("mousemove", ev => show(el, ev));
    el.addEventListener("mouseleave", hide);
    el.addEventListener("focus", () => show(el, null));
    el.addEventListener("blur", hide);
  }

  // ---- table view ----------------------------------------------------------------
  const tv = document.getElementById("table-view");
  let html = `<table class="data"><thead><tr><th>Metric</th><th>Unit</th><th>Better</th><th class="num">ARM</th><th class="num">x86</th><th class="num">ARM vs x86</th></tr></thead><tbody>`;
  for (const g of groups) {
    html += `<tr class="g"><td colspan="6">${esc(GROUP_LABEL[g])}</td></tr>`;
    for (const r of rows.filter(r => r.dimension === g)) {
      html += `<tr><td>${esc(r.label)}</td><td>${esc(r.unit)}</td><td>${r.direction === "LIB" ? "lower" : "higher"}</td><td class="num">${fmtVal(r.arm)}</td><td class="num">${fmtVal(r.x86)}</td><td class="num">${esc(fmtRel(r.ratio))}</td></tr>`;
    }
  }
  html += `</tbody></table>`;
  tv.innerHTML = html;
  const tbtn = document.getElementById("toggle-table");
  tbtn.addEventListener("click", () => { const open = tv.classList.toggle("hidden") === false; tbtn.textContent = open ? "Hide table" : "Show table"; tbtn.setAttribute("aria-expanded", String(open)); });

  // ---- theme toggle ----------------------------------------------------------------
  const root = document.documentElement, thbtn = document.getElementById("toggle-theme");
  const isDark = () => root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const paint = () => { thbtn.textContent = isDark() ? "Light mode" : "Dark mode"; };
  thbtn.addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; paint(); });
  paint();
})();
</script>
</body>
</html>
